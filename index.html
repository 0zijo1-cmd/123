<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>吉祥物印象挑戰</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F4F3EF;
      --card-bg: #FFFFFF;
      --accent: #FF5A36;
      --accent-soft: #FFEFEA;
      --text-main: #1D1D1F;
      --text-sub: #86868B;
      --input-bg: #F6F5F2;
      --radius-sm: 14px;
      --radius-md: 22px;
      --radius-lg: 32px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 24px 16px 80px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .app-shell {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header-card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 28px 24px 22px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .badge-pill {
      align-self: flex-start;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 99px;
      letter-spacing: 0.5px;
    }

    .header-card h1 {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: var(--text-main);
      margin-top: 4px;
    }

    .header-card p {
      font-size: 13px;
      color: var(--text-sub);
      line-height: 1.5;
    }

    .config-box {
      background: var(--card-bg);
      border-radius: var(--radius-md);
      padding: 14px;
      display: flex;
      gap: 10px;
    }

    .input-clean {
      border: none;
      background: var(--input-bg);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      outline: none;
      width: 100%;
      transition: background 0.2s;
    }

    .input-clean:focus {
      background: #EFECE6;
    }

    .pool-card {
      background: var(--card-bg);
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .pool-title {
      font-size: 12px;
      font-weight: 800;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
    }

    .chips-flow {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--input-bg);
      border-radius: 99px;
      padding: 6px 14px 6px 6px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      color: var(--text-main);
      transition: all 0.15s;
    }

    .chip-item:hover {
      background: #EAE6DD;
    }

    .chip-item img {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      object-fit: cover;
    }

    .list-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .impression-card {
      background: var(--card-bg);
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .avatar-wrapper {
      width: 76px;
      height: 76px;
      min-width: 76px;
      background: var(--input-bg);
      border-radius: 18px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar-hover {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.4);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .avatar-wrapper:hover .avatar-hover {
      opacity: 1;
    }

    .card-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .name-input {
      font-size: 16px;
      font-weight: 800;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text-main);
      width: 80%;
    }

    .btn-delete {
      background: none;
      border: none;
      font-size: 18px;
      color: #C7C7CC;
      cursor: pointer;
      padding: 2px 6px;
      transition: color 0.15s;
    }

    .btn-delete:hover {
      color: var(--accent);
    }

    .impression-input {
      width: 100%;
      background: var(--input-bg);
      border: none;
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      outline: none;
      transition: background 0.2s;
    }

    .impression-input:focus {
      background: #EFECE6;
    }

    .button-deck {
      display: flex;
      gap: 12px;
      margin-top: 6px;
    }

    .action-btn {
      flex: 1;
      padding: 16px;
      border-radius: var(--radius-md);
      border: none;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s, opacity 0.2s;
    }

    .action-btn:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background: var(--card-bg);
      color: var(--text-main);
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-card {
      background: #fff;
      border-radius: var(--radius-lg);
      max-width: 420px;
      width: 100%;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-preview {
      width: 100%;
      border-radius: 20px;
      max-height: 60vh;
      object-fit: contain;
    }

    .modal-tip {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      text-align: center;
    }

    canvas {
      display: none;
    }
  </style>
</head>
<body>

  <div class="app-shell">
    <header class="header-card">
      <div class="badge-pill">Mascot Impression</div>
      <h1>吉祥物第一印象</h1>
      <p>點選下方候選角色或自行換圖，寫下一句你對牠們的真實印象！</p>
    </header>

    <div class="config-box">
      <input type="text" id="eventTitle" class="input-clean" value="吉祥物印象表" placeholder="輸入活動標題" />
      <input type="text" id="userSignature" class="input-clean" value="@你的暱稱" placeholder="你的署名" style="max-width: 130px;" />
    </div>

    <div class="pool-card">
      <div class="pool-title">
        <span>快速加入吉祥物（測試候選池）</span>
        <span style="font-size: 11px; color: var(--text-sub);">點擊即加入</span>
      </div>
      <div class="chips-flow" id="mascotPool"></div>
    </div>

    <div class="list-container" id="itemList"></div>

    <div class="button-deck">
      <button class="action-btn btn-secondary" onclick="addNewItem()">＋ 新增一欄</button>
      <button class="action-btn btn-primary" onclick="renderBorderlessCanvas()">✨ 生成分享圖</button>
    </div>
  </div>

  <div class="modal" id="modalOverlay">
    <div class="modal-card">
      <img id="modalPreviewImg" class="modal-preview" alt="分享圖" />
      <div class="modal-tip">💡 手機用戶直接「長按圖片」加入相簿即可！</div>
      <div class="button-deck">
        <button class="action-btn btn-secondary" onclick="closeModal()">關閉</button>
        <button class="action-btn btn-primary" onclick="downloadImage()">下載圖片</button>
      </div>
    </div>
  </div>

  <canvas id="exportCanvas"></canvas>

  <script>
    // 輔助產生彩色 SVG 測試頭像（保證不破圖）
    function makeAvatar(emoji, bg) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
        <rect width="160" height="160" rx="36" fill="${bg}"/>
        <text x="80" y="98" font-size="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto">${emoji}</text>
      </svg>`;
      return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;
    }

    // 6 組預設測試候選吉祥物（晚點您有真實圖片時，只需替換成您的檔名如 'bear.png'）
    const DEFAULT_MASCOTS = [
      { name: "小熊波波", img: makeAvatar("🐻", "#FFE8D6") },
      { name: "兔兔米娜", img: makeAvatar("🐰", "#FFDEE9") },
      { name: "貓咪大福", img: makeAvatar("🐱", "#FFF3B0") },
      { name: "小恐龍雷克斯", img: makeAvatar("🦖", "#D8F3DC") },
      { name: "企鵝波比", img: makeAvatar("🐧", "#E0F2FE") },
      { name: "小狐狸皮皮", img: makeAvatar("🦊", "#FEE2E2") }
    ];

    // 預設填入 3 個示範項目
    let currentItems = [
      { name: "小熊波波", img: DEFAULT_MASCOTS[0].img, impression: "看起來憨憨的，但感覺很有安全感！" },
      { name: "兔兔米娜", img: DEFAULT_MASCOTS[1].img, impression: "軟萌外表，眼神裡卻透露出一絲聰明。" },
      { name: "小恐龍雷克斯", img: DEFAULT_MASCOTS[3].img, impression: "雖然手短短的，但笑起來超級治癒。" }
    ];

    let lastGeneratedBlob = null;

    function initPool() {
      const pool = document.getElementById("mascotPool");
      pool.innerHTML = "";
      DEFAULT_MASCOTS.forEach((m) => {
        const btn = document.createElement("button");
        btn.className = "chip-item";
        btn.innerHTML = `<img src="${m.img}" alt="${m.name}" /><span>${m.name}</span>`;
        btn.onclick = () => {
          currentItems.push({ name: m.name, img: m.img, impression: "" });
          renderList();
        };
        pool.appendChild(btn);
      });
    }

    function renderList() {
      const listEl = document.getElementById("itemList");
      listEl.innerHTML = "";

      currentItems.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "impression-card";
        card.innerHTML = `
          <div class="avatar-wrapper" onclick="triggerUpload(${index})">
            <img src="${item.img}" id="img-${index}" />
            <div class="avatar-hover">換圖</div>
            <input type="file" id="file-${index}" accept="image/*" style="display:none;" onchange="handleFile(event, ${index})" />
          </div>
          <div class="card-body">
            <div class="card-top">
              <input type="text" class="name-input" value="${item.name}" oninput="currentItems[${index}].name = this.value" placeholder="角色名稱" />
              <button class="btn-delete" onclick="removeItem(${index})">✕</button>
            </div>
            <input type="text" class="impression-input" value="${item.impression}" oninput="currentItems[${index}].impression = this.value" placeholder="輸入一句話印象..." />
          </div>
        `;
        listEl.appendChild(card);
      });
    }

    function triggerUpload(index) {
      document.getElementById(`file-${index}`).click();
    }

    function handleFile(event, index) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          currentItems[index].img = e.target.result;
          renderList();
        };
        reader.readAsDataURL(file);
      }
    }

    function addNewItem() {
      currentItems.push({
        name: `新角色 ${currentItems.length + 1}`,
        img: makeAvatar("✨", "#E5E7EB"),
        impression: ""
      });
      renderList();
    }

    function removeItem(index) {
      if (currentItems.length <= 1) return;
      currentItems.splice(index, 1);
      renderList();
    }

    async function renderBorderlessCanvas() {
      const canvas = document.getElementById("exportCanvas");
      const ctx = canvas.getContext("2d");

      const width = 1080;
      const cardHeight = 160;
      const headerH = 260;
      const footerH = 110;
      const margin = 50;
      const gap = 20;

      const totalH = headerH + (currentItems.length * (cardHeight + gap)) + footerH;
      canvas.width = width;
      canvas.height = totalH;

      ctx.fillStyle = "#F4F3EF";
      ctx.fillRect(0, 0, width, totalH);

      const boxW = width - (margin * 2);

      drawRoundedRect(ctx, margin, 50, boxW, 170, 36, "#FFFFFF");

      drawRoundedRect(ctx, margin + 40, 80, 160, 36, 18, "#FFEFEA");
      ctx.fillStyle = "#FF5A36";
      ctx.font = "800 16px 'Plus Jakarta Sans', sans-serif";
      ctx.fillText("MASCOT VIBES", margin + 62, 104);

      const title = document.getElementById("eventTitle").value || "吉祥物印象挑戰";
      ctx.fillStyle = "#1D1D1F";
      ctx.font = "900 46px 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif";
      ctx.fillText(title, margin + 40, 172);

      const sig = document.getElementById("userSignature").value || "@匿名粉絲";
      ctx.fillStyle = "#86868B";
      ctx.font = "700 24px 'Noto Sans TC', sans-serif";
      ctx.textAlign = "right";
      ctx.fillText(sig, margin + boxW - 40, 172);
      ctx.textAlign = "left";

      let startY = headerH;

      for (let i = 0; i < currentItems.length; i++) {
        const item = currentItems[i];
        const cardY = startY + (i * (cardHeight + gap));

        drawRoundedRect(ctx, margin, cardY, boxW, cardHeight, 28, "#FFFFFF");

        const avatarSize = 120;
        const avatarX = margin + 20;
        const avatarY = cardY + 20;

        drawRoundedRect(ctx, avatarX, avatarY, avatarSize, avatarSize, 24, "#F6F5F2");

        try {
          const imgObj = await loadImage(item.img);
          ctx.save();
          roundedClip(ctx, avatarX, avatarY, avatarSize, avatarSize, 24);
          ctx.drawImage(imgObj, avatarX, avatarY, avatarSize, avatarSize);
          ctx.restore();
        } catch (e) {
          ctx.fillStyle = "#86868B";
          ctx.font = "700 36px sans-serif";
          ctx.fillText("?", avatarX + 48, avatarY + 72);
        }

        const textStartX = avatarX + avatarSize + 28;
        const maxTextW = boxW - avatarSize - 76;

        ctx.fillStyle = "#1D1D1F";
        ctx.font = "800 30px 'Noto Sans TC', sans-serif";
        ctx.fillText(item.name || `角色 ${i + 1}`, textStartX, cardY + 54);

        const bubbleY = cardY + 74;
        const bubbleH = 58;
        drawRoundedRect(ctx, textStartX, bubbleY, maxTextW, bubbleH, 18, "#F6F5F2");

        ctx.fillStyle = "#333336";
        ctx.font = "600 22px 'Noto Sans TC', sans-serif";
        const txt = item.impression || "(未填寫)";
        const clipped = fitText(ctx, txt, maxTextW - 32);
        ctx.fillText(clipped, textStartX + 18, bubbleY + 37);
      }

      ctx.fillStyle = "#86868B";
      ctx.font = "700 20px 'Noto Sans TC', sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("#吉祥物第一印象 • 同好交流使用", width / 2, totalH - 45);
      ctx.textAlign = "left";

      canvas.toBlob((blob) => {
        lastGeneratedBlob = blob;
        document.getElementById("modalPreviewImg").src = URL.createObjectURL(blob);
        document.getElementById("modalOverlay").style.display = "flex";
      }, "image/png");
    }

    function drawRoundedRect(ctx, x, y, width, height, radius, fill) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
      if (fill) {
        ctx.fillStyle = fill;
        ctx.fill();
      }
    }

    function roundedClip(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
      ctx.clip();
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject();
        img.src = src;
      });
    }

    function fitText(ctx, text, maxW) {
      if (ctx.measureText(text).width <= maxW) return text;
      let str = text;
      while (str.length > 0 && ctx.measureText(str + "...").width > maxW) {
        str = str.slice(0, -1);
      }
      return str + "...";
    }

    function downloadImage() {
      if (!lastGeneratedBlob) return;
      const a = document.createElement("a");
      a.href = URL.createObjectURL(lastGeneratedBlob);
      a.download = "mascot-impression.png";
      a.click();
    }

    function closeModal() {
      document.getElementById("modalOverlay").style.display = "none";
    }

    initPool();
    renderList();
  </script>
</body>
</html>
