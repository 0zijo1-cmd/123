<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>吉祥物印象挑戰</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F7F7F7;
      --card-bg: #FFFFFF;
      --green: #a6fba5;
      --black: #111111;
      --gray-light: #EEEEEE;
      --text-muted: #888888;
      --radius-sm: 12px;
      --radius-md: 20px;
      --radius-lg: 28px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', -apple-system, sans-serif;
      font-weight: 400;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--black);
      padding: 24px 16px 80px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .app-shell {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header-card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 26px 22px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .badge-pill {
      align-self: flex-start;
      background: var(--green);
      color: var(--black);
      font-size: 11px;
      font-weight: 500;
      padding: 4px 12px;
      border-radius: 99px;
      letter-spacing: 0.5px;
    }

    .header-card h1 {
      font-size: 24px;
      font-weight: 500;
      letter-spacing: -0.3px;
      color: var(--black);
      margin-top: 2px;
    }

    .header-card p {
      font-size: 13px;
      font-weight: 300;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .config-box {
      background: var(--card-bg);
      border-radius: var(--radius-md);
      padding: 12px;
      display: flex;
      gap: 10px;
    }

    .input-clean {
      border: none;
      background: var(--gray-light);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 400;
      color: var(--black);
      outline: none;
      width: 100%;
    }

    .pool-card {
      background: var(--card-bg);
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .pool-title {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
    }

    .chips-flow {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--gray-light);
      border-radius: 99px;
      padding: 5px 12px 5px 5px;
      font-size: 13px;
      font-weight: 400;
      cursor: pointer;
      border: none;
      color: var(--black);
      transition: background 0.15s;
    }

    .chip-item:hover {
      background: var(--green);
    }

    .chip-item img {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }

    .list-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .impression-card {
      background: var(--card-bg);
      border-radius: var(--radius-md);
      padding: 14px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .avatar-wrapper {
      width: 72px;
      height: 72px;
      min-width: 72px;
      background: var(--gray-light);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .avatar-hover {
      position: absolute;
      inset: 0;
      background: rgba(17, 17, 17, 0.4);
      color: #fff;
      font-size: 10px;
      font-weight: 400;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .avatar-wrapper:hover .avatar-hover {
      opacity: 1;
    }

    .card-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .name-input {
      font-size: 15px;
      font-weight: 500;
      border: none;
      outline: none;
      background: transparent;
      color: var(--black);
      width: 80%;
    }

    .btn-delete {
      background: none;
      border: none;
      font-size: 16px;
      color: #CCCCCC;
      cursor: pointer;
      padding: 2px 6px;
    }

    .btn-delete:hover {
      color: var(--black);
    }

    .impression-input {
      width: 100%;
      background: var(--gray-light);
      border: none;
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 300;
      color: var(--black);
      outline: none;
    }

    .button-deck {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }

    .action-btn {
      flex: 1;
      padding: 15px;
      border-radius: var(--radius-md);
      border: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s;
    }

    .btn-secondary {
      background: var(--card-bg);
      color: var(--black);
    }

    .btn-primary {
      background: var(--green);
      color: var(--black);
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(17, 17, 17, 0.6);
      backdrop-filter: blur(8px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-card {
      background: #fff;
      border-radius: var(--radius-lg);
      max-width: 400px;
      width: 100%;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-preview {
      width: 100%;
      border-radius: 16px;
      max-height: 58vh;
      object-fit: contain;
    }

    .modal-tip {
      font-size: 12px;
      font-weight: 400;
      color: var(--text-muted);
      text-align: center;
    }

    canvas {
      display: none;
    }
  </style>
</head>
<body>

  <div class="app-shell">
    <header class="header-card">
      <div class="badge-pill">Mascot Vibes</div>
      <h1>吉祥物第一印象</h1>
      <p>點選下方候選角色或換圖，寫下一句對牠們的真實印象。</p>
    </header>

    <div class="config-box">
      <input type="text" id="eventTitle" class="input-clean" value="吉祥物第一印象挑戰" placeholder="輸入活動標題" />
      <input type="text" id="userSignature" class="input-clean" value="@你的暱稱" placeholder="你的署名" style="max-width: 120px;" />
    </div>

    <div class="pool-card">
      <div class="pool-title">
        <span>快速加入候選池</span>
        <span style="font-size: 11px;">點擊即加入</span>
      </div>
      <div class="chips-flow" id="mascotPool"></div>
    </div>

    <div class="list-container" id="itemList"></div>

    <div class="button-deck">
      <button class="action-btn btn-secondary" onclick="addNewItem()">＋ 新增一欄</button>
      <button class="action-btn btn-primary" onclick="renderCanvasCard()">✨ 生成分享圖</button>
    </div>
  </div>

  <div class="modal" id="modalOverlay">
    <div class="modal-card">
      <img id="modalPreviewImg" class="modal-preview" alt="分享圖" />
      <div class="modal-tip">長按圖片即可加入照片庫</div>
      <div class="button-deck">
        <button class="action-btn btn-secondary" onclick="closeModal()">關閉</button>
        <button class="action-btn btn-primary" onclick="downloadImage()">下載圖片</button>
      </div>
    </div>
  </div>

  <canvas id="exportCanvas"></canvas>

  <script>
    // 預設 6 個高穩定度測試圖片（完全跨域可載入）
    const DEFAULT_MASCOTS = [
      { name: "香脆薯條", img: "https://picsum.photos/id/292/200/200" },
      { name: "多汁漢堡", img: "https://picsum.photos/id/1080/200/200" },
      { name: "甜筒冰淇淋", img: "https://picsum.photos/id/429/200/200" },
      { name: "手沖咖啡", img: "https://picsum.photos/id/1060/200/200" },
      { name: "經典披薩", img: "https://picsum.photos/id/312/200/200" },
      { name: "草莓甜甜圈", img: "https://picsum.photos/id/490/200/200" }
    ];

    let currentItems = [
      { name: "香脆薯條", img: DEFAULT_MASCOTS[0].img, impression: "剛起鍋自帶鹽粒根本不需要沾醬！" },
      { name: "多汁漢堡", img: DEFAULT_MASCOTS[1].img, impression: "原本以為是反派，結果是全劇最可愛吃貨。" },
      { name: "甜筒冰淇淋", img: DEFAULT_MASCOTS[2].img, impression: "融化速度比我下班打卡還快。" }
    ];

    let lastGeneratedBlob = null;

    function renderPool() {
      const pool = document.getElementById("mascotPool");
      pool.innerHTML = "";
      DEFAULT_MASCOTS.forEach((m) => {
        const btn = document.createElement("button");
        btn.className = "chip-item";
        btn.innerHTML = `<img src="${m.img}" alt="${m.name}" loading="lazy" /><span>${m.name}</span>`;
        btn.onclick = () => {
          currentItems.push({ name: m.name, img: m.img, impression: "" });
          renderList();
        };
        pool.appendChild(btn);
      });
    }

    function renderList() {
      const listEl = document.getElementById("itemList");
      listEl.innerHTML = "";

      currentItems.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "impression-card";
        card.innerHTML = `
          <div class="avatar-wrapper" onclick="triggerUpload(${index})">
            <img src="${item.img}" id="img-${index}" />
            <div class="avatar-hover">換圖</div>
            <input type="file" id="file-${index}" accept="image/*" style="display:none;" onchange="handleFile(event, ${index})" />
          </div>
          <div class="card-body">
            <div class="card-top">
              <input type="text" class="name-input" value="${item.name}" oninput="currentItems[${index}].name = this.value" placeholder="角色名稱" />
              <button class="btn-delete" onclick="removeItem(${index})">✕</button>
            </div>
            <input type="text" class="impression-input" value="${item.impression}" oninput="currentItems[${index}].impression = this.value" placeholder="輸入一句話印象..." />
          </div>
        `;
        listEl.appendChild(card);
      });
    }

    function triggerUpload(index) {
      document.getElementById(`file-${index}`).click();
    }

    function handleFile(event, index) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          currentItems[index].img = e.target.result;
          renderList();
        };
        reader.readAsDataURL(file);
      }
    }

    function addNewItem() {
      currentItems.push({
        name: `新角色 ${currentItems.length + 1}`,
        img: "https://picsum.photos/id/1025/200/200",
        impression: ""
      });
      renderList();
    }

    function removeItem(index) {
      if (currentItems.length <= 1) return;
      currentItems.splice(index, 1);
      renderList();
    }

    async function renderCanvasCard() {
      const canvas = document.getElementById("exportCanvas");
      const ctx = canvas.getContext("2d");

      const width = 1080;
      const cardHeight = 154;
      const headerH = 250;
      const footerH = 100;
      const margin = 50;
      const gap = 18;

      const totalH = headerH + (currentItems.length * (cardHeight + gap)) + footerH;
      canvas.width = width;
      canvas.height = totalH;

      ctx.fillStyle = "#F7F7F7";
      ctx.fillRect(0, 0, width, totalH);

      const boxW = width - (margin * 2);

      drawRoundedRect(ctx, margin, 46, boxW, 164, 32, "#FFFFFF");

      drawRoundedRect(ctx, margin + 36, 76, 140, 32, 16, "#a6fba5");
      ctx.fillStyle = "#111111";
      ctx.font = "500 15px 'Plus Jakarta Sans', sans-serif";
      ctx.fillText("MASCOT VIBES", margin + 54, 97);

      const title = document.getElementById("eventTitle").value || "吉祥物第一印象挑戰";
      ctx.fillStyle = "#111111";
      ctx.font = "500 42px 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif";
      ctx.fillText(title, margin + 36, 164);

      const sig = document.getElementById("userSignature").value || "@匿名粉絲";
      ctx.fillStyle = "#888888";
      ctx.font = "400 22px 'Noto Sans TC', sans-serif";
      ctx.textAlign = "right";
      ctx.fillText(sig, margin + boxW - 36, 164);
      ctx.textAlign = "left";

      let startY = headerH;

      for (let i = 0; i < currentItems.length; i++) {
        const item = currentItems[i];
        const cardY = startY + (i * (cardHeight + gap));

        drawRoundedRect(ctx, margin, cardY, boxW, cardHeight, 24, "#FFFFFF");

        const avatarSize = 114;
        const avatarX = margin + 20;
        const avatarY = cardY + 20;

        drawRoundedRect(ctx, avatarX, avatarY, avatarSize, avatarSize, 18, "#EEEEEE");

        try {
          const imgObj = await loadImage(item.img);
          ctx.save();
          roundedClip(ctx, avatarX, avatarY, avatarSize, avatarSize, 18);
          ctx.drawImage(imgObj, avatarX, avatarY, avatarSize, avatarSize);
          ctx.restore();
        } catch (e) {}

        const textStartX = avatarX + avatarSize + 26;
        const maxTextW = boxW - avatarSize - 74;

        ctx.fillStyle = "#111111";
        ctx.font = "500 28px 'Noto Sans TC', sans-serif";
        ctx.fillText(item.name || `角色 ${i + 1}`, textStartX, cardY + 52);

        const bubbleY = cardY + 72;
        const bubbleH = 54;
        drawRoundedRect(ctx, textStartX, bubbleY, maxTextW, bubbleH, 14, "#F7F7F7");

        ctx.fillStyle = "#333333";
        ctx.font = "300 21px 'Noto Sans TC', sans-serif";
        const txt = item.impression || "(未填寫)";
        const clipped = fitText(ctx, txt, maxTextW - 28);
        ctx.fillText(clipped, textStartX + 16, bubbleY + 34);
      }

      ctx.fillStyle = "#888888";
      ctx.font = "400 18px 'Noto Sans TC', sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("#吉祥物第一印象 • 同好交流使用", width / 2, totalH - 42);
      ctx.textAlign = "left";

      canvas.toBlob((blob) => {
        lastGeneratedBlob = blob;
        document.getElementById("modalPreviewImg").src = URL.createObjectURL(blob);
        document.getElementById("modalOverlay").style.display = "flex";
      }, "image/png");
    }

    function drawRoundedRect(ctx, x, y, width, height, radius, fill) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    }

    function roundedClip(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
      ctx.clip();
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => resolve(img);
        img.onerror = () => reject();
        img.src = src;
      });
    }

    function fitText(ctx, text, maxW) {
      if (ctx.measureText(text).width <= maxW) return text;
      let str = text;
      while (str.length > 0 && ctx.measureText(str + "...").width > maxW) {
        str = str.slice(0, -1);
      }
      return str + "...";
    }

    function downloadImage() {
      if (!lastGeneratedBlob) return;
      const a = document.createElement("a");
      a.href = URL.createObjectURL(lastGeneratedBlob);
      a.download = "mascot-impression.png";
      a.click();
    }

    function closeModal() {
      document.getElementById("modalOverlay").style.display = "none";
    }

    // 啟動渲染
    renderPool();
    renderList();
  </script>
</body>
</html>
